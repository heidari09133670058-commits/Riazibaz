workflows:
  android-debug:
    name: RiaziBaz Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "ir.riazibaz.app"
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon :app:assembleDebug
          else
            echo "Gradle wrapper is missing; downloading Gradle 8.9..."
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
